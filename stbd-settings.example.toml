# STBD 配置文件（示例 / 模板）
#
# ── 怎么用（推荐走捷径）─────────────────────────────
# 在 STBD 里敲 `:settings`：
#   · 还没有配置文件 → 它照这份模板在**可执行文件旁边**生成一份，并打开给你改
#   · 已经有了      → 直接打开给你改
# 改完 `:w` 保存，再敲 `:config reload` 就生效（不想重载也可以重启 STBD）。
#
# 也可以手动放置。查找顺序（先找到的先用）：
#   1. 环境变量 STBD_CONFIG 指定的路径
#   2. stbd.exe 旁边的 stbd-settings.toml     ← 首选，配置跟着程序走
#   3. %APPDATA%\stbd\stbd-settings.toml      ← 兜底（exe 目录写不进去时）
#      Linux/macOS 为 ~/.config/stbd/stbd-settings.toml
# 敲 `:config path` 可以看到程序实际读的是哪一个。
#
# ── 语法 ───────────────────────────────────────────────
# · 这是 TOML 格式，就是一行一个 `键 = 值`
# · `#` 开头的一整行是注释，写给自己看的
# · 下面每一项都写成了**当前默认值**，所以照抄不改不会改变任何行为
# · 键名写错会**直接报错**（而不是被悄悄忽略），启动时在状态栏提示原因，
#   并退回全部默认值 —— 为的是不让你遇到「改了却没生效」这种玄学问题
# · ⚠️ 分节（[colors] 这种方括号）必须放在文件**最后**：
#   TOML 的规则是「分节之后的键都属于那个分节」，
#   在 [colors] 后面写 tab_width = 8 会被当成 colors.tab_width 而报错
#
# ── 和 :set 的关系 ─────────────────────────────────────
# 下面每一项都能在运行中用 `:set` 命令临时改（如 `:set tabwidth 2`），
# 但那只影响**当前这次运行**，退出就没了。想永久生效就来改这个文件。
# 反过来，`:set` 也**不会**写回这个文件。
#
# 语言服务器那一项（lsp_max_servers）比较特殊：`:set lspmaxservers 1` 之后
# 多出来的那些服务器会**当场被收掉**，不等重启 —— 你敲完就能看到内存降下去。
#
# 用 `:config` 可以随时查看当前生效的设置。

# 是否显示行号。对应 `:set number` / `:set nonumber`
show_line_numbers = true

# 一次 Tab 插入的空格数，范围 1-16。对应 `:set tabwidth N`
# 写代码常改成 4
tab_width = 8

# 光标与视口上/下边缘至少保持的行距（类似 vim 的 scrolloff），范围 0-100。
# 对应 `:set scrolloff N`
scroll_margin = 3

# 光标与视口左/右边缘至少保持的列距（类似 vim 的 sidescrolloff），范围 0-100。
# 注意单位是**终端显示格数**：一个汉字算 2 格。对应 `:set sidescrolloff N`
side_scroll_margin = 5

# 最多同时保留几个语言服务器，范围 0-8。
# 对应 `:set lspmaxservers N`
#
#   0 = 完全不开（要最省的话就写 0）
#   1 = 只留当前这个项目的
#   3 = 默认：够放下「库 + 用它的程序」，也够放下一个混着 C 的 Rust 项目
#
# ⚠️ 它数的是**进程**，不是项目：一个 Rust 和 C 混着的项目自己就要两个
# （rust-analyzer 一个，clangd 一份；clangd 小得多）。
# 写 2 的话这种项目已经把名额吃满，再跳一次项目就要重新加载。
#
# 为什么要管这个数：一个加载完的 rust-analyzer 大约要 1 GB 内存
# （实测：本项目 1.2 GB）。跳项目时它会先加载一遍 crate 图，要几秒；
# 这个数就是「用内存换那几秒」。
#
# 它**不是**「预先开几个」—— 服务器是用到了才起的，
# 所以你只在一个项目里干活时，写 1 和写 3 完全一样（都只有 1 个进程）。
lsp_max_servers = 3


# ══════════════════════════════════════════════════════
# 语言服务器（`[lsp.<语言>]` 一节一个）
# ══════════════════════════════════════════════════════
#
# 编辑器**一行分析代码的逻辑都没有** —— 语法、类型、借检查全交给这些服务器。
# 下面这几节是**内置的默认值**照抄过来的，所以照抄不改不会改变任何行为。
#
# ⚠️ 它们和内置默认是**合并**关系，不是替换：
#    · 同名的节（比如 `[lsp.rust]`）会**盖住**内置那条 —— 想改默认值就写它
#    · 新名字的节（比如 `[lsp.zig]`）就是**加一条**，内置的照样在
#    · 所以你可以只写一节，不必把下面几节全抄一遍
#
# 每一节能写什么：
#   command      必填。起什么命令。**可以是绝对路径**（那个程序不在 PATH 上时用）。
#                留空 = 这条不要了（用来关掉一条内置的）
#   extensions   必填。管哪些扩展名。**小写、不带点**（写 "rs"，不是 ".rs"）。
#                忘了写会直接报错并指出行号（给个空默认只会让它安静地失效）
#   args         命令行参数，一个词一个（不用自己加引号）。默认空
#   root_marker  往上找这个文件当项目根。默认不要求根 → 用文件自己所在的目录
#   language_id  didOpen 里报的语言名。默认 = 节名
#
# ⚠️ 关于 `language_id`：它**不是装饰**。`clangd` 靠它决定把 `.h` 当 C 还是
#    当 C++ 解析。所以下面 C 和 C++ 分成了两节（两节的 command 相同，
#    所以只会起**一个** clangd 进程）。
#
# ⚠️ 加一门语言之前先确认那个命令真的在 PATH 上：
#    在终端敲一下就行。找不到的话，打开那种文件时状态栏会说一句
#    「LSP: ... 找不到」，而不会崩 —— 但也没有诊断。

# Rust。`rust-analyzer` 随 rustup 就有：`rustup component add rust-analyzer`
[lsp.rust]
command = "rust-analyzer"
extensions = ["rs"]
# rust-analyzer **必须**给一个真项目根：拿一个不包含这个文件的目录去糊它，
# 它一个字都不说（实测 45 秒 0 份推送）。所以这里要求往上找到 Cargo.toml。
root_marker = "Cargo.toml"

# C。`clangd` 随 LLVM 发行版就有（就在 LLVM 的 bin 目录里）
[lsp.c]
command = "clangd"
extensions = ["c", "h"]
# 不写 root_marker = 用文件自己所在的目录。
# clangd 自己会往上找 `compile_commands.json`；我们硬要求它反而会把
# 「没有 compile_commands.json 的普通 C 文件」全部变成「不起服务器」。
#
# ⚠️ 没有 `compile_commands.json` 时 clangd 也能跑，但只有语法级的判断 ——
#    「找不到 stdio.h」这类假错误会一堆。生成它：
#      CMake：`cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ...`
#      其它：`bear -- make`（Linux）

# C++。跟 C 同一套（command 一样 → 共用同一个进程），只是 languageId 不同
[lsp.cpp]
command = "clangd"
extensions = ["cpp", "cc", "cxx", "hpp", "hxx", "hh"]

# `.h` 既可能是 C 也可能是 C++，我们**不猜**：按上面写的，它是当 C 看的。
# 想当 C++ 就把 "h" 从 [lsp.c] 那行挪到 [lsp.cpp] 那行。


# ══════════════════════════════════════════════════════
# 颜色（这一节必须放在文件最后，原因见上面「语法」）
# ══════════════════════════════════════════════════════
#
# 颜色怎么写：
#   · 具名色：black red green yellow blue magenta cyan purple gray grey white
#             darkgray darkgrey lightred lightgreen lightyellow
#             lightblue lightmagenta lightcyan orange
#   · 十六进制：#ffcc00，也支持简写 #fc0（等于 #ffcc00）
#   · 不染色：reset（也可以写 default / none）→ 用终端默认色
#
# 大小写不敏感，两边的空格会被忽略。
# 只写其中几项也行，没写的用默认值（下面的值就是默认值）。
# 改完要**重启 STBD** 才生效。

[colors]
# 正文文字
text = "green"

# 行号
#
# ⚠️ 暗灰是故意的：行号是**背景设施**，不该跟「有毛病」抢颜色。
# 行号退成暗灰之后，行号栏上三种状态一眼分得开：
#   暗灰 = 没毛病、黄色 = 警告、红色 = 错误
line_number = "darkgray"

# 有错误的那一行的行号（`:errors` 列表里也用这个色）
error = "lightred"

# 有警告的那一行的行号
warning = "lightyellow"

# 当前行的背景色（想关掉高亮就写 "reset"）
# 0x303030 是原来写死的深灰
current_line_bg = "#303030"

# `:` 命令输入
command = "cyan"

# 只读模式的模式标签（-- READ-ONLY --）
mode_readonly = "darkgray"

# 编辑模式的模式标签（-- EDIT --）
# 编辑模式会改文件，所以默认给个显眼的黄色提醒自己
mode_edit = "yellow"

# 快捷键提示文字
hint = "darkgray"

# 底部状态信息（如 Saved xxx）
status = "green"

